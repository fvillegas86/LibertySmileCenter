server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /videos/ {
        types { video/mp4 mp4; }
        default_type application/octet-stream;
        sendfile on;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
